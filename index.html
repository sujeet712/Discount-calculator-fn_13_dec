<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Discount Calculator</h1>

        <div class="calculator">
            <div class="input-group">
                <label for="originalPrice">Enter Original Price:</label>
                <input type="number" id="originalPrice" placeholder="Enter original price">
            </div>

            <div class="input-group">
                <label for="discountPercentage">Enter Discount Percentage:</label>
                <input type="number" id="discountPercentage" placeholder="Enter discount percentage">
            </div>

            <div class="operations">
                <button id="calculateDiscount">Calculate Discount</button>
            </div>

            <div class="result-container">
                <h3>Discounted Price: <span id="discountedPrice">-</span></h3>
                <h3>Discount Amount: <span id="discountAmount">-</span></h3>
                <p id="calculation-steps">Enter the original price and discount percentage to calculate.</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
